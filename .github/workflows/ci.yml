name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NDK_VERSION: 29.0.14206865
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core (host tests, clippy, fmt)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: core } }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: Format
        run: cargo fmt --all --check
      - name: Pure-Rust tests (no llama.cpp)
        run: cargo test -p neuron-core --no-default-features -p neuron-sandbox
      - name: Engine tests (compiles llama.cpp for the host)
        run: cargo test -p neuron-core -p neuron-ffi
      # Separate target dir on purpose: clippy's wrapper gives build scripts a
      # second OUT_DIR, and llama-cpp-sys-2's install step panics when it finds
      # the dangling lib*.so -> lib*.so.0 links left by the first install.
      - name: Clippy
        run: CARGO_TARGET_DIR=target/clippy cargo clippy --workspace --all-targets -- -D warnings

  android:
    name: Android (arm64 Rust core + APK + unit tests)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Install NDK and CMake
        run: echo y | sdkmanager "ndk;${NDK_VERSION}" "cmake;3.22.1"
      - name: Build OpenCL link stubs for Adreno
        run: core/scripts/setup-opencl-android.sh
        env: { ANDROID_NDK_ROOT: "${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK (runs cargo ndk + uniffi-bindgen)
        run: ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Lint
        run: ./gradlew lintDebug || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  hexagon:
    name: Hexagon NPU backend (Snapdragon toolchain)
    runs-on: ubuntu-latest
    needs: rust
    # The Hexagon SDK ships only inside Qualcomm's toolchain image, the same one
    # llama.cpp's docs/backend/snapdragon uses. This job produces
    # libggml-hexagon.so plus the libggml-htp-v{73,75,79,81}.so DSP skels.
    container:
      image: ghcr.io/snapdragon-toolchain/arm64-android:v0.7
      options: --user root
    env:
      # The image has clang but no `cc`; Rust host build scripts need a linker.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CC_x86_64_unknown_linux_gnu: clang
      CXX_x86_64_unknown_linux_gnu: clang++
      # No `make` in the image, only Ninja.
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      # The image ships NDK r29 and Hexagon SDK 6.6.0.0 but no OpenCL SDK, so
      # build the Khronos link stubs the same way the android job does.
      - name: Build OpenCL link stubs for Adreno
        run: core/scripts/setup-opencl-android.sh
        env: { ANDROID_NDK_ROOT: /opt/android-ndk-r29 }
      - name: Build libneuron with Hexagon + OpenCL
        run: core/scripts/build-android.sh --out core/target/android-jniLibs
        env:
          ANDROID_NDK_ROOT: /opt/android-ndk-r29
          HEXAGON_SDK_ROOT: /opt/hexagon/6.6.0.0
      - uses: actions/upload-artifact@v4
        with:
          name: neuron-snapdragon-libs
          path: |
            core/target/android-jniLibs/arm64-v8a/*.so
            core/target/android-jniLibs/htp/*.so
